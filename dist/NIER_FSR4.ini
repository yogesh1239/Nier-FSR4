; NIER_FSR4 - AMD FSR 4.1.1 native AA for the NIER_DLAA mod.
; Place next to NieRAutomata.exe together with the patched d3d11.dll, NIER_DLAA.ini,
; NIER_FSR4.dll, amd_fidelityfx_loader_dx12.dll and amd_fidelityfx_upscaler_dx12.dll.
; The mod's own options (toggle key, jitter, object motion, mip bias...) stay in NIER_DLAA.ini.

[FSR]
; Provider to use: a substring of the version name (4.1.1 by default) or "auto" for the SDK default.
; FSR 4 needs a Radeon RX 7000 or RX 9000 GPU. Anything else falls back to FSR 3.1.x (see NIER_FSR4.log).
Version=4.1.1
; Extra RCAS sharpening (FSR 4 is fairly sharp already)
Sharpening=0
Sharpness=0.0
; +1 or -1: flip how the jitter is passed to FSR (try JitterSignY=-1 if the image shimmers or looks soft)
JitterSignX=1
JitterSignY=1
; Multipliers on top of the mod's motion vector scale (1.0, pixels)
MotionVectorScaleX=1.0
MotionVectorScaleY=1.0
; -1 = take it from the mod's DLSS settings (HDR on, auto exposure on, depth not inverted)
DepthInverted=-1
HDR=-1
AutoExposure=-1
; 1 = depth uses an infinite far plane. The mod's depth has a finite far plane, so leave at 0.
DepthInfinite=0
; 1 = FSR debug overlay (motion vectors and reactivity in the corners)
DebugView=0
; 1 = FSR API validation messages in NIER_FSR4.log
DebugChecking=0

[Camera]
; FSR wants camera near/far and vertical FOV, which DLSS does not take.
; 1 = read them from the mod's camera tracking (NIER_DLAA 1.1 only)
ReadFromMod=1
; Overrides, 0 = automatic
Near=0
Far=0
FovDegrees=0
ViewSpaceToMeters=1.0
