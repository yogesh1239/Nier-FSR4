; NIER_DLAA - place next to NieRAutomata.exe together with d3d11.dll and nvngx_dlss.dll

[General]
; 0 = pure pass-through proxy (no hooks at all)
Enabled=1

[DLSS]
; DLAA on the HDR scene (also jitters the camera)
Enabled=1
; Default, or a preset letter (e.g. K or J)
Preset=Default
; +1 or -1: how the jitter is reported to DLSS
JitterSign=1
; Home: DLAA on/off (always works)
ToggleKey=0x24
; Texture LOD bias while DLAA runs (0 = off)
MipBias=-0.5
; 1 = motion vectors for moving characters, taken from the game's motion-blur pass
; (needs the in-game Motion Blur option on; without it only camera motion is used)
ObjectMotion=1
; 1 = hide the game's motion blur itself while DLAA runs
HideMotionBlur=1
; 1 = show the motion vectors over the frame (still camera = black)
DebugView=0

[Jitter]
; Jitter without DLSS, for testing only
Enabled=0
DebugScale=1.0

[Debug]
; 1 = enable the debug keys below and DumpFrameAt (troubleshooting).
; 0 = F6 / F7 / F10 / F11 / End / Page Up do nothing.
Enabled=0
; F10: write the next frame's pass list next to the dll
DumpFrameKey=0x79
; Also dump automatically after this many frames (0 = off)
DumpFrameAt=0
DumpShaders=0
; F11: save the next CaptureFrames frames (DLSS in/out, motion vectors, depth, final image)
CaptureKey=0x7A
CaptureFrames=64
; End: mip bias on/off
MipBiasKey=0x23
; Page Up: flip JitterSign live
JitterSignKey=0x21
; F6: motion-vector view on/off (characters with their own motion vectors are tinted blue)
DebugViewKey=0x75
; F7: character motion vectors on/off (compare with camera-only motion)
ObjectMotionKey=0x76
